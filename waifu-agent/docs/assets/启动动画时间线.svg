    <text x="72" y="107" text-anchor="middle" fill="#f5a623" font-size="10" font-weight="bold">4b · 动作</text>
    <text x="142" y="107" fill="#ccc" font-size="11">触发 special_01 motion (大招特效, 7.8s)</text>
    <text x="142" y="124" fill="#888" font-size="10">或 mtn_01 idle (自然站立晃动) 如果不想太夸张</text>

    <line x1="12" y1="136" x2="480" y2="136" stroke="#332200" stroke-width="1"/>

    <!-- 子阶段 4c -->
    <rect x="12" y="144" width="120" height="22" rx="4" fill="#f5a62340"/>
    <text x="72" y="159" text-anchor="middle" fill="#f5a623" font-size="10" font-weight="bold">4c · 说话</text>
    <text x="142" y="159" fill="#ccc" font-size="11">TTS播放: 「我在。」或角色自定义问候语</text>
    <text x="142" y="176" fill="#888" font-size="10">同时驱动 ParamA 口型参数做lip sync</text>

    <line x1="12" y1="195" x2="480" y2="195" stroke="#332200" stroke-width="1"/>

