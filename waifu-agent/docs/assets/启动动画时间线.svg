    <text x="72" y="231" text-anchor="middle" fill="#e94560" font-size="10" font-weight="bold">3d · 光环收尾</text>
    <text x="142" y="231" fill="#ccc" font-size="11">Aura光环脉冲扩散 + 表情渐变为exp_01</text>
    <text x="142" y="248" fill="#888" font-size="10">ParamAura: 1→0 (脉冲一次, 像能量波纹扩散)</text>
  </g>

