    <rect x="290" y="60" width="100" height="18" rx="3" fill="#e9456040"/><text x="340" y="73" text-anchor="middle" fill="#e94560" font-size="10">0 → 0.3</text>
    <rect x="450" y="60" width="100" height="18" rx="3" fill="#f1c40f80"/><text x="500" y="73" text-anchor="middle" fill="#f1c40f" font-size="10">0.3 → 1 ⚡</text>
    <rect x="610" y="60" width="100" height="18" rx="3" fill="#2ecc7140"/><text x="660" y="73" text-anchor="middle" fill="#2ecc71" font-size="10">1 (睁眼)</text>
    <rect x="770" y="60" width="100" height="18" rx="3" fill="#2ecc7140"/><text x="820" y="73" text-anchor="middle" fill="#2ecc71" font-size="10">1</text>
    <rect x="930" y="60" width="100" height="18" rx="3" fill="#2ecc7140"/><text x="980" y="73" text-anchor="middle" fill="#2ecc71" font-size="10">1</text>

