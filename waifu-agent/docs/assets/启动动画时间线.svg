    <text x="72" y="159" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">3c · 睁眼! ⚡</text>
    <text x="142" y="159" fill="#f1c40f" font-size="11" font-weight="bold">关键时刻: 眼睛睁开!</text>
    <text x="142" y="176" fill="#ccc" font-size="10">EyeLOpen/ROpen: 0→1 (0.3s ease-out, 像真的在睁眼)</text>
    <text x="142" y="193" fill="#ccc" font-size="10">然后眨眼1次 (快速闭眼0.1s→再睁开, 适应光线)</text>

    <line x1="12" y1="208" x2="528" y2="208" stroke="#331133" stroke-width="1"/>

    <!-- 子阶段 3d -->
