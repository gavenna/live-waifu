    <rect x="290" y="88" width="100" height="18" rx="3" fill="#9b59b640"/><text x="340" y="101" text-anchor="middle" fill="#9b59b6" font-size="10">exp_03→01</text>
    <rect x="450" y="88" width="100" height="18" rx="3" fill="#9b59b680"/><text x="500" y="101" text-anchor="middle" fill="#9b59b6" font-size="10">exp_01 中性</text>
    <rect x="610" y="88" width="100" height="18" rx="3" fill="#9b59b640"/><text x="660" y="101" text-anchor="middle" fill="#9b59b6" font-size="10">exp_01</text>
    <rect x="770" y="88" width="100" height="18" rx="3" fill="#f5a62380"/><text x="820" y="101" text-anchor="middle" fill="#f5a623" font-size="10">exp_02 微笑 ✨</text>
    <rect x="930" y="88" width="100" height="18" rx="3" fill="#9b59b640"/><text x="980" y="101" text-anchor="middle" fill="#9b59b6" font-size="10">exp_02/04</text>

