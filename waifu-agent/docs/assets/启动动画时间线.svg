<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="phase0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="phase1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#1a1a40"/>
    </linearGradient>
    <linearGradient id="phase2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#533483"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="phase3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#533483"/>
    </linearGradient>
    <linearGradient id="phase4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="900" fill="#0d0d1a" rx="12"/>

  <!-- 标题 -->
  <text x="600" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">waifu-agent 启动动画时间线</text>
  <text x="600" y="66" text-anchor="middle" fill="#888" font-size="13">D → A 混合方案 · 终端启动 + 数字生命苏醒 · 总时长 ~7s</text>

  <!-- ===== 时间轴 ===== -->
  <line x1="60" y1="100" x2="1140" y2="100" stroke="#333" stroke-width="2"/>
  <!-- 刻度 -->
  <g fill="#666" font-size="10" text-anchor="middle">
    <text x="60" y="120">0.0s</text><line x1="60" y1="95" x2="60" y2="105" stroke="#444" stroke-width="1"/>
    <text x="168" y="120">0.5s</text><line x1="168" y1="95" x2="168" y2="105" stroke="#444" stroke-width="1"/>
    <text x="383" y="120">1.5s</text><line x1="383" y1="95" x2="383" y2="105" stroke="#444" stroke-width="1"/>
    <text x="598" y="120">2.5s</text><line x1="598" y1="95" x2="598" y2="105" stroke="#444" stroke-width="1"/>
    <text x="705" y="120">3.5s</text><line x1="705" y1="95" x2="705" y2="105" stroke="#444" stroke-width="1"/>
    <text x="920" y="120">5.5s</text><line x1="920" y1="95" x2="920" y2="105" stroke="#444" stroke-width="1"/>
    <text x="1140" y="120">7.0s</text><line x1="1140" y1="95" x2="1140" y2="105" stroke="#444" stroke-width="1"/>
  </g>

  <!-- Phase 条 -->
  <rect x="60" y="88" width="108" height="16" rx="3" fill="url(#phase0)" opacity="0.9"/>
  <text x="114" y="100" text-anchor="middle" fill="#aaa" font-size="10" font-weight="bold">Phase 0: 窗口</text>

  <rect x="168" y="88" width="430" height="16" rx="3" fill="url(#phase1)" opacity="0.9"/>
  <text x="383" y="100" text-anchor="middle" fill="#5dade2" font-size="10" font-weight="bold">Phase 1: 终端启动</text>

  <rect x="598" y="88" width="107" height="16" rx="3" fill="url(#phase2)" opacity="0.9"/>
  <text x="651" y="100" text-anchor="middle" fill="#bb8fce" font-size="10" font-weight="bold">Phase 2: 溶解</text>

  <rect x="705" y="88" width="215" height="16" rx="3" fill="url(#phase3)" opacity="0.9"/>
  <text x="812" y="100" text-anchor="middle" fill="#f1948a" font-size="10" font-weight="bold">Phase 3: 苏醒</text>

  <rect x="920" y="88" width="220" height="16" rx="3" fill="url(#phase4)" opacity="0.9"/>
  <text x="1030" y="100" text-anchor="middle" fill="#f9e79f" font-size="10" font-weight="bold">Phase 4: 问候</text>

  <!-- ===== Phase 0 详情 ===== -->
  <g transform="translate(60, 145)">
    <rect x="0" y="0" width="240" height="170" rx="8" fill="#1a1a2e" stroke="#2a2a4e" stroke-width="1"/>
    <rect x="0" y="0" width="240" height="28" rx="8" fill="#1e1e3a"/>
    <rect x="0" y="20" width="240" height="8" fill="#1e1e3a"/>
    <text x="120" y="19" text-anchor="middle" fill="#aaa" font-size="12" font-weight="bold">🪟 Phase 0 · 窗口出现</text>
    <text x="12" y="48" fill="#888" font-size="11">⏱ 0.0s – 0.5s</text>
    <line x1="12" y1="55" x2="228" y2="55" stroke="#2a2a4e" stroke-width="1"/>
    <text x="12" y="72" fill="#ccc" font-size="11">窗口背景: <tspan fill="#e94560">rgba(0,0,0,1)</tspan> 不透明</text>
    <text x="12" y="92" fill="#ccc" font-size="11">窗口尺寸: 600×800 无框</text>
    <text x="12" y="112" fill="#888" font-size="10">⚙ 实现: Tauri窗口默认行为</text>
    <text x="12" y="132" fill="#888" font-size="10">📐 画布: 全黑, React overlay就绪</text>
    <text x="12" y="155" fill="#666" font-size="9">注意: 此时用户看不到任何东西,</text>
    <text x="12" y="168" fill="#666" font-size="9">纯黑窗口像一块画布准备就绪</text>
  </g>

  <!-- Phase 0 → 1 箭头 -->
  <line x1="300" y1="230" x2="340" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arrowHead)"/>

  <!-- ===== Phase 1 详情 ===== -->
  <g transform="translate(348, 145)">
    <rect x="0" y="0" width="280" height="170" rx="8" fill="#0f1a30" stroke="#1a3355" stroke-width="1"/>
    <rect x="0" y="0" width="280" height="28" rx="8" fill="#111f38"/>
    <rect x="0" y="20" width="280" height="8" fill="#111f38"/>
    <text x="140" y="19" text-anchor="middle" fill="#5dade2" font-size="12" font-weight="bold">💻 Phase 1 · 终端启动</text>
    <text x="12" y="48" fill="#888" font-size="11">⏱ 0.5s – 2.5s</text>
    <line x1="12" y1="55" x2="268" y2="55" stroke="#1a3355" stroke-width="1"/>
    <text x="12" y="72" fill="#5dade2" font-size="10" font-family="'Consolas','Courier New',monospace">&gt; waifu-agent kernel v0.6.x</text>
    <text x="12" y="88" fill="#5dade2" font-size="10" font-family="'Consolas','Courier New',monospace">&gt; cubism4 runtime... <tspan fill="#2ecc71">OK</tspan></text>
    <text x="12" y="104" fill="#5dade2" font-size="10" font-family="'Consolas','Courier New',monospace">&gt; loading Mao.model3.json... <tspan fill="#2ecc71">OK</tspan></text>
    <text x="12" y="120" fill="#5dade2" font-size="10" font-family="'Consolas','Courier New',monospace">&gt; injecting SOUL.md... <tspan fill="#2ecc71">OK</tspan></text>
    <text x="12" y="136" fill="#5dade2" font-size="10" font-family="'Consolas','Courier New',monospace">&gt; consciousness: <tspan fill="#f1c40f">ONLINE</tspan></text>
    <text x="12" y="155" fill="#888" font-size="10">⚙ 实现: React overlay组件</text>
    <text x="12" y="168" fill="#888" font-size="9">monospace绿色文字, 逐行动画, 最后光标闪烁3次</text>
  </g>

  <!-- Phase 1 → 2 箭头 -->
  <line x1="628" y1="230" x2="668" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arrowHead)"/>

  <!-- ===== Phase 2 详情 ===== -->
  <g transform="translate(676, 145)">
    <rect x="0" y="0" width="240" height="170" rx="8" fill="#1a1030" stroke="#332255" stroke-width="1"/>
    <rect x="0" y="0" width="240" height="28" rx="8" fill="#221540"/>
    <rect x="0" y="20" width="240" height="8" fill="#221540"/>
    <text x="120" y="19" text-anchor="middle" fill="#bb8fce" font-size="12" font-weight="bold">✨ Phase 2 · 溶解过渡</text>
    <text x="12" y="48" fill="#888" font-size="11">⏱ 2.5s – 3.5s</text>
    <line x1="12" y1="55" x2="228" y2="55" stroke="#332255" stroke-width="1"/>
