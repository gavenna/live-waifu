    <text x="72" y="222" text-anchor="middle" fill="#2ecc71" font-size="10" font-weight="bold">✅ 就绪</text>
    <text x="142" y="222" fill="#2ecc71" font-size="11">进入正常idle状态, 等待用户交互</text>
    <text x="142" y="244" fill="#888" font-size="10">整个启动序列结束, 角色在桌面"活"了</text>
