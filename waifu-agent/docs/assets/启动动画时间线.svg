    <text x="72" y="55" text-anchor="middle" fill="#e94560" font-size="10" font-weight="bold">3a · 渐显</text>
    <text x="142" y="55" fill="#ccc" font-size="11">模型 alpha 0→1, 姿态: 闭眼+低头+慢呼吸</text>
    <text x="142" y="72" fill="#888" font-size="10">参数: EyeOpen=0, BodyAngleY=-5, Breath=慢, 表情exp_03</text>

    <line x1="12" y1="84" x2="528" y2="84" stroke="#331133" stroke-width="1"/>

    <!-- 子阶段 3b -->
    <rect x="12" y="92" width="120" height="22" rx="4" fill="#e9456040"/>
    <text x="72" y="107" text-anchor="middle" fill="#e94560" font-size="10" font-weight="bold">3b · 身体回正</text>
    <text x="142" y="107" fill="#ccc" font-size="11">身体缓缓直起, 呼吸加速</text>
    <text x="142" y="124" fill="#888" font-size="10">BodyAngleY: -5→0 (1s ease-out), Breath频率翻倍</text>

    <line x1="12" y1="136" x2="528" y2="136" stroke="#331133" stroke-width="1"/>

    <!-- 子阶段 3c -->
