    <text x="12" y="92" fill="#ccc" font-size="11">粒子向中心汇聚</text>
    <text x="12" y="112" fill="#ccc" font-size="11">背景不透明→半透明渐变</text>
    <text x="12" y="132" fill="#888" font-size="10">⚙ 实现: Pixi displacement +</text>
    <text x="12" y="146" fill="#888" font-size="10">particle emitter</text>
    <text x="12" y="162" fill="#888" font-size="9">模型在后台静默加载(alpha=0)</text>
  </g>

