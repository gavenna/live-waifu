    <rect x="420" y="35" width="200" height="32" rx="5" fill="#9b59b630" stroke="#9b59b660" stroke-width="1"/>
    <text x="520" y="49" text-anchor="middle" fill="#9b59b6" font-size="10" font-weight="bold">Live2D Parameter Control</text>
