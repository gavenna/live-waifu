<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="input" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="llm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#533483"/>
      <stop offset="100%" stop-color="#3d2c5e"/>
    </linearGradient>
    <linearGradient id="emotion" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#b8304f"/>
    </linearGradient>
    <linearGradient id="tts" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a8754"/>
      <stop offset="100%" stop-color="#0b5e3b"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6a817"/>
      <stop offset="100%" stop-color="#c47f0a"/>
    </linearGradient>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e6b6b"/>
      <stop offset="100%" stop-color="#094747"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e94560"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0a8754"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="1480" fill="#0d1117"/>
  <rect x="0" y="0" width="900" height="60" fill="url(#header)"/>
  <text x="450" y="38" text-anchor="middle" fill="#e6e6e6" font-size="20" font-weight="bold">waifu-agent 语音对话完整流程 v0.6</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- Phase 1: 输入 -->
  <!-- ════════════════════════════════════════════════════ -->

  <!-- Section label -->
  <text x="20" y="95" fill="#64748b" font-size="13" font-weight="bold">▎输入层</text>

  <!-- Voice input box -->
  <rect x="30" y="110" width="380" height="70" rx="8" fill="url(#input)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="142" fill="#e2e8f0" font-size="14" font-weight="bold">🎤 语音输入 (STT)</text>
  <text x="50" y="164" fill="#94a3b8" font-size="12">空格按住 → faster-whisper → 转文字</text>

  <!-- Text input box -->
  <rect x="490" y="110" width="380" height="70" rx="8" fill="url(#input)" stroke="#334155" stroke-width="1"/>
  <text x="510" y="142" fill="#e2e8f0" font-size="14" font-weight="bold">⌨️ 文字输入</text>
  <text x="510" y="164" fill="#94a3b8" font-size="12">主窗口 / 聊天窗口发送</text>

  <!-- Merge arrows -->
  <line x1="220" y1="180" x2="220" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="180" x2="680" y2="195" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="680" y1="195" x2="220" y2="195" stroke="#94a3b8" stroke-width="1"/>
  <line x1="220" y1="195" x2="220" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tauri event box -->
  <rect x="220" y="215" width="460" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="240" text-anchor="middle" fill="#94a3b8" font-size="12">emit("chat-send") → Tauri event 中继</text>

  <line x1="450" y1="255" x2="450" y2="285" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- Phase 2: LLM 流式请求 -->
  <!-- ════════════════════════════════════════════════════ -->

  <text x="20" y="315" fill="#64748b" font-size="13" font-weight="bold">▎LLM 层 (Rust 后端)</text>

  <rect x="130" y="300" width="640" height="130" rx="8" fill="url(#llm)" stroke="#7c3aed" stroke-width="1"/>
  <text x="450" y="325" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">🧠 quick_chat_stream (SSE 流式)</text>

  <!-- Inner boxes -->
  <rect x="155" y="338" width="280" height="40" rx="4" fill="#1e1b4b" opacity="0.8"/>
  <text x="170" y="363" fill="#c4b5fd" font-size="12">build_system_prompt()</text>
  <text x="320" y="363" fill="#94a3b8" font-size="10">SOUL + USER + MEMORY + thoughts</text>

  <rect x="465" y="338" width="280" height="40" rx="4" fill="#1e1b4b" opacity="0.8"/>
  <text x="480" y="363" fill="#c4b5fd" font-size="12">reqwest SSE stream</text>
  <text x="605" y="363" fill="#94a3b8" font-size="10">stream: true</text>

  <rect x="155" y="385" width="590" height="36" rx="4" fill="#1e1b4b" opacity="0.8"/>
  <text x="170" y="405" fill="#94a3b8" font-size="11">每个 token → emit("chat-chunk", {content}) → emit("chat-done") 或 emit("chat-error")</text>
  <text x="170" y="417" fill="#64748b" font-size="10">日志前缀 [chat_stream]</text>

  <line x1="450" y1="430" x2="450" y2="460" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- Phase 3: 前端流式处理 (useChatStream) -->
  <!-- ════════════════════════════════════════════════════ -->

  <text x="20" y="495" fill="#64748b" font-size="13" font-weight="bold">▎前端流式处理层 (useChatStream hook)</text>

  <rect x="30" y="510" width="840" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Step 1: 情绪检测 -->
  <rect x="50" y="525" width="370" height="80" rx="6" fill="url(#emotion)" stroke="#e94560" stroke-width="1"/>
  <text x="70" y="548" fill="#fecdd3" font-size="13" font-weight="bold">① 情绪标签解析 (首批 ~30 chars)</text>
  <text x="70" y="568" fill="#fca5a5" font-size="11">匹配 EMOTION_TAG_RE: /^\[(happy|sad|...)\]/</text>
  <text x="70" y="584" fill="#fca5a5" font-size="11">命中 → onEmotion() + 剥离标签 → 干净文本</text>
  <text x="70" y="598" fill="#94a3b8" font-size="10">日志: [ChatStream] EMOTION: happy</text>

  <!-- Step 2: 句子切分 -->
  <rect x="470" y="525" width="380" height="80" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="490" y="548" fill="#e2e8f0" font-size="13" font-weight="bold">② 句子切分 (splitSentences)</text>
  <text x="490" y="568" fill="#94a3b8" font-size="11">主边界: [。！？；\n]  副边界: [，]</text>
  <text x="490" y="584" fill="#94a3b8" font-size="11">max 100 chars 无边界 → 逗号强制切</text>
  <text x="490" y="598" fill="#94a3b8" font-size="10">日志: [ChatStream] sentence #N: "..." (N chars)</text>

  <!-- Arrow between 1 and 2 -->
  <line x1="420" y1="565" x2="470" y2="565" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Fallback path -->
  <rect x="50" y="615" width="800" height="36" rx="4" fill="#422c2c" opacity="0.8"/>
  <text x="70" y="637" fill="#fca5a5" font-size="11">⚠️ 异常路径: 200 chars 仍无标签 → detectEmotionFallback() 关键词匹配 (哈哈→happy, 唉→sad, ...)</text>

  <!-- Step 3: TTS 队列 -->
  <rect x="50" y="665" width="800" height="60" rx="6" fill="url(#tts)" stroke="#0a8754" stroke-width="1"/>
  <text x="70" y="688" fill="#bbf7d0" font-size="13" font-weight="bold">③ TTS 流水线 (生成 &amp; 播放并行)</text>
  <text x="70" y="708" fill="#86efac" font-size="11">ttsQueue 积攒句子 → processQueue() 循环: 取队首 → invoke("edge_tts") → push audioQueue → playBuffer()</text>
  <text x="70" y="720" fill="#94a3b8" font-size="10">生成和播放独立: 前一句播放时后一句已在生成  |  日志: [ChatStream] TTS generate #N / play start / play done</text>

  <!-- Done -->
  <line x1="450" y1="740" x2="450" y2="770" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- Phase 4: 双路并行输出 -->
  <!-- ════════════════════════════════════════════════════ -->

  <text x="20" y="800" fill="#64748b" font-size="13" font-weight="bold">▎输出层 (并行)</text>

  <!-- Audio path -->
  <rect x="30" y="815" width="400" height="130" rx="8" fill="url(#output)" stroke="#e6a817" stroke-width="1"/>
  <text x="50" y="842" fill="#fef3c7" font-size="14" font-weight="bold">🔊 音频链路</text>
  <text x="50" y="865" fill="#fde68a" font-size="12">playBuffer(buf, vol) @ useTts.ts</text>
  <text x="50" y="885" fill="#fde68a" font-size="12">→ AudioContext.decodeAudioData()</text>
  <text x="50" y="905" fill="#fde68a" font-size="12">→ createBufferSource() → connect(gain) → start()</text>
  <text x="50" y="925" fill="#fde68a" font-size="12">→ onended → processQueue() 播放下一句</text>
  <text x="50" y="940" fill="#94a3b8" font-size="10">每条日志: [ChatStream] play start/done</text>

  <!-- Visual path -->
  <rect x="470" y="815" width="400" height="130" rx="8" fill="url(#output)" stroke="#e6a817" stroke-width="1"/>
  <text x="490" y="842" fill="#fef3c7" font-size="14" font-weight="bold">🎭 视觉链路 (PIXI ticker)</text>
  <text x="490" y="865" fill="#fde68a" font-size="12">onSentenceStart → generateEnergy(text)</text>
  <text x="490" y="885" fill="#fde68a" font-size="12">→ energyData[] → 口型参数 (ParamA)</text>
  <text x="490" y="905" fill="#fde68a" font-size="12">→ 4 级口型: mouth_lv0→lv1→lv2→open</text>
  <text x="490" y="925" fill="#fde68a" font-size="12">→ isSpeaking → smooth.mouth 插值</text>
  <text x="490" y="940" fill="#94a3b8" font-size="10">每条日志: [Anim] expr speaking / idle start</text>

  <line x1="450" y1="945" x2="450" y2="975" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- Phase 5: 情绪驱动动画 -->
  <!-- ════════════════════════════════════════════════════ -->

  <text x="20" y="1010" fill="#64748b" font-size="13" font-weight="bold">▎情绪驱动层 (PIXI ticker 每帧)</text>

  <rect x="30" y="1025" width="840" height="170" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>

  <!-- Expression -->
  <rect x="50" y="1040" width="380" height="70" rx="6" fill="#2d1b3d" stroke="#9333ea" stroke-width="1"/>
  <text x="70" y="1065" fill="#d8b4fe" font-size="13" font-weight="bold">表情: EMOTION_EXPRESSION[emotion]</text>
  <text x="70" y="1085" fill="#c084fc" font-size="11">happy→exp_02(微笑) sad→exp_05 angry→exp_08</text>
  <text x="70" y="1100" fill="#c084fc" font-size="11">surprised→exp_04 shy→exp_06 loving→exp_07</text>

  <!-- Motion -->
  <rect x="470" y="1040" width="380" height="70" rx="6" fill="#2d1b3d" stroke="#9333ea" stroke-width="1"/>
  <text x="490" y="1065" fill="#d8b4fe" font-size="13" font-weight="bold">动作: EMOTION_MOTION_BIAS[emotion]</text>
  <text x="490" y="1085" fill="#c084fc" font-size="11">happy: freq=1.3× 魔法特效+20%</text>
  <text x="490" y="1100" fill="#c084fc" font-size="11">sad: freq=0.6× 少动 / shy: freq=0.8×</text>

  <!-- Transition -->
  <rect x="50" y="1120" width="800" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="70" y="1143" fill="#94a3b8" font-size="12" font-weight="bold">情绪状态转换</text>
  <text x="70" y="1162" fill="#94a3b8" font-size="11">speaking 开始 → emotion-driven expression + motion  |  idle 返回 → 保持情绪 15s → emotionTimerRef 归零后 → 回归 neutral</text>
  <text x="70" y="1177" fill="#94a3b8" font-size="10">日志: [Anim] expr speaking / speaking start / idle start (lingering=true/false)</text>

  <!-- Idle loop note -->
  <line x1="450" y1="1195" x2="450" y2="1225" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- Phase 6: 后处理 -->
  <!-- ════════════════════════════════════════════════════ -->

  <text x="20" y="1255" fill="#64748b" font-size="13" font-weight="bold">▎后处理</text>

  <rect x="30" y="1270" width="840" height="90" rx="8" fill="url(#memory)" stroke="#0e6b6b" stroke-width="1"/>

  <rect x="50" y="1285" width="250" height="60" rx="4" fill="#0d3b3b" opacity="0.8"/>
  <text x="70" y="1310" fill="#5eead4" font-size="12" font-weight="bold">💾 对话记录</text>
  <text x="70" y="1330" fill="#99f6e4" font-size="11">save_turn(role, text, mode)</text>

  <rect x="330" y="1285" width="250" height="60" rx="4" fill="#0d3b3b" opacity="0.8"/>
  <text x="350" y="1310" fill="#5eead4" font-size="12" font-weight="bold">📝 记忆提取</text>
  <text x="350" y="1330" fill="#99f6e4" font-size="11">"记住"触发 → append_memory</text>

  <rect x="610" y="1285" width="240" height="60" rx="4" fill="#0d3b3b" opacity="0.8"/>
  <text x="630" y="1310" fill="#5eead4" font-size="12" font-weight="bold">🔄 历史更新</text>
  <text x="630" y="1330" fill="#99f6e4" font-size="11">historyRef push (last 40)</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- Footer: log tags -->
  <!-- ════════════════════════════════════════════════════ -->

  <rect x="30" y="1390" width="840" height="75" rx="8" fill="#0d1117" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="1413" fill="#64748b" font-size="11" font-weight="bold">日志标签追踪: 完整链路</text>
  <text x="50" y="1432" fill="#475569" font-size="10">
    <tspan fill="#94a3b8">[App]</tspan> chat-send →
    <tspan fill="#a78bfa">[ChatStream]</tspan> startStream / FIRST TOKEN / EMOTION / sentence / TTS generate / play start / play done / ALL DONE →
    <tspan fill="#f59e0b">[Anim]</tspan> expr speaking / speaking start / idle start →
    <tspan fill="#94a3b8">[App]</tspan> response done
  </text>
  <text x="50" y="1453" fill="#475569" font-size="10">
    <tspan fill="#64748b">后端补充:</tspan>
    <tspan fill="#94a3b8">[chat_stream]</tspan> POST / first chunk in / DONE
    <tspan fill="#64748b">  TTS:</tspan>
    <tspan fill="#94a3b8">[TTS]</tspan> Edge TTS unavailable fallback
  </text>
</svg>
