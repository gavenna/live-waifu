[core]
name: target_dummy
displayText: Target Dummy
displayText_zh: 靶子
displayDescription: training dummy (huge HP, immobile, unarmed)
displayDescription_zh: 训练靶子 —— 超高血量 / 不移动 / 不还手，用于录制各兵种的攻击方式与效果

class: CustomUnitMetadata
price: 0
maxHp: 1000000000
mass: 3000
techLevel: 1
radius: 30
displayRadius: 40
isBio: false

[graphics]
total_frames: 1
image: target_body.png
image_shadow: AUTO

# 不攻击：录攻击效果时靶子不能还手。
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false

# 站桩：moveSpeed 0 = 不动（若引擎对 0 有异常，改 0.01 即可，肉眼仍近乎静止）。
[movement]
movementType: LAND
moveSpeed: 0
maxTurnSpeed: 0

# 说明（改这个单位时注意）：
#  • 刻意**不写** isBuilding —— 让靶子算「单位」而不是「建筑」，
#    否则部分武器（如机甲闪电"对地建筑较弱"）的伤害会被按建筑口径修正，录出来的数值失真。
#  • maxHp 取 10 亿：远低于 Java int 上限 2147483647，够厚又不会溢出的安全值；
#    想更极端可提到 2000000000，但别再高（引擎内部可能做加成，越界会翻负）。
#  • displayRadius 40 = 靶子在画面上的大小；换图时同步调它。
