<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>war-vote 控制面板</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; background: #0b0f0b; color: #e8f0e8;
         font-family: "Microsoft YaHei", sans-serif; }
  h1 { font-size: 22px; margin: 0 0 20px; font-weight: 600; }
  .row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
          border-radius: 8px; padding: 16px 22px; min-width: 150px; }
  .card .k { color: #8fa08f; font-size: 13px; margin-bottom: 6px; }
  .card .v { font-size: 30px; font-weight: 700; }
  .red { color: #ff5a5a; } .blue { color: #5a9bff; } .gold { color: #ffd166; }
  button { background: rgba(255,255,255,0.08); color: #e8f0e8;
           border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
           padding: 12px 26px; font-size: 16px; cursor: pointer; margin-right: 12px;
           font-family: inherit; }
  button:hover { background: rgba(255,255,255,0.16); }
  button.primary { background: #2e7d4f; border-color: #3fa06a; }
  button.primary:hover { background: #37945e; }
  #voters { font-size: 14px; line-height: 1.9; color: #b9c8b9; }
  #msg { font-size: 14px; min-height: 20px; color: #ffd166; margin: 12px 0 4px; }
</style>
</head>
<body>
  <h1>war-vote 控制面板</h1>

  <div class="row">
    <div class="card"><div class="k">状态</div><div class="v" id="state">—</div></div>
    <div class="card"><div class="k">剩余</div><div class="v" id="left">—</div></div>
    <div class="card"><div class="k">红方</div><div class="v red" id="red">0</div></div>
    <div class="card"><div class="k">蓝方</div><div class="v blue" id="blue">0</div></div>
    <div class="card"><div class="k">已生成</div><div class="v" id="file" style="font-size:14px">—</div></div>
  </div>

  <div style="margin-bottom: 6px">
    <button class="primary" onclick="api('demo')">一键演示（无需弹幕）</button>
    <button class="primary" onclick="api('start')">开始投票</button>
    <button onclick="api('fake?n=20')">模拟 20 票</button>
    <button onclick="api('lock')">立即锁定</button>
    <button onclick="api('reset')">重置</button>
    <button onclick="window.open('http://localhost:3001', '_blank')">打开直播画面</button>
  </div>
  <div id="msg"></div>

  <div class="card" style="margin-top: 16px">
    <div class="k">最近投票</div>
    <div id="voters">—</div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let snap = null;

function render() {
  if (!snap) return;
  $('state').textContent = snap.state;
  $('state').className = 'v' + (snap.state === 'READY' ? ' gold' : '');
  $('red').textContent = snap.totals.red;
  $('blue').textContent = snap.totals.blue;
  $('file').textContent = snap.lastFile ? snap.lastFile.split('\\').pop() : '—';

  if (snap.state === 'VOTING') {
    const s = Math.ceil(snap.remainingMs / 1000);
    $('left').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  } else {
    $('left').textContent = '—';
  }

  $('voters').innerHTML = snap.recentVoters.length
    ? snap.recentVoters.map((v) =>
        `<span class="${v.team}">${v.name}</span> → ${v.label}`).join('<br>')
    : '—';
}

async function api(action) {
  $('msg').textContent = '…';
  try {
    const r = await fetch('/api/' + action);
    const j = await r.json();
    $('msg').textContent = j.ok ? '已执行：' + action : '失败：' + j.error;
  } catch (e) {
    $('msg').textContent = '请求失败：' + e.message;
  }
}

function connect() {
  let retry = 1000;
  const open = () => {
    const ws = new WebSocket('ws://' + location.host);
    ws.onopen = () => { retry = 1000; };
    ws.onmessage = (e) => { snap = JSON.parse(e.data); render(); };
    ws.onclose = () => { setTimeout(open, retry); retry = Math.min(retry * 2, 30000); };
  };
  open();
}

connect();
setInterval(render, 500);
</script>
</body>
</html>
