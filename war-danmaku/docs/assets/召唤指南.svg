  <text x="130" y="535" font-family="sans-serif" font-size="11" fill="#f0d68a">鲜花 ~10 抖币</text>
  <text x="240" y="535" font-family="sans-serif" font-size="11" fill="#ddaa44">弓手</text>
  <text x="400" y="535" font-family="monospace" font-size="11" fill="#999">20</text>
  <text x="480" y="535" font-family="monospace" font-size="11" fill="#999">125</text>
  <text x="560" y="535" font-family="sans-serif" font-size="11" fill="#999">远程狙击</text>

  <rect x="40" y="543" width="640" height="26" rx="0" fill="#151210"/>
  <text x="60" y="561" font-family="sans-serif" font-size="11" fill="#887766">进阶</text>
  <text x="130" y="561" font-family="sans-serif" font-size="11" fill="#f0d68a">铁锤 ~30 抖币</text>
  <text x="240" y="561" font-family="sans-serif" font-size="11" fill="#ddaa44">投石车</text>
  <text x="400" y="561" font-family="monospace" font-size="11" fill="#999">60</text>
  <text x="480" y="561" font-family="monospace" font-size="11" fill="#999">250</text>
  <text x="560" y="561" font-family="sans-serif" font-size="11" fill="#999">AOE 轰炸</text>

  <!-- 核心 -->
  <rect x="40" y="569" width="640" height="3" rx="0" fill="#2a2218"/>

  <rect x="40" y="576" width="640" height="26" rx="0" fill="#1a1410"/>
  <text x="60" y="594" font-family="sans-serif" font-size="11" fill="#cc8833">核心</text>
  <text x="130" y="594" font-family="sans-serif" font-size="11" fill="#f0d68a">盾墙 ~99 抖币</text>
  <text x="240" y="594" font-family="sans-serif" font-size="11" fill="#cc8833">皇家卫队</text>
  <text x="400" y="594" font-family="monospace" font-size="11" fill="#cc8833">100</text>
  <text x="480" y="594" font-family="monospace" font-size="11" fill="#cc8833">1000</text>
  <text x="560" y="594" font-family="sans-serif" font-size="11" fill="#cc8833">带头像 肉盾</text>

  <rect x="40" y="602" width="640" height="26" rx="0" fill="#151210"/>
  <text x="60" y="620" font-family="sans-serif" font-size="11" fill="#cc8833">核心</text>
  <text x="130" y="620" font-family="sans-serif" font-size="11" fill="#f0d68a">火矢齐射 ~199 抖币</text>
  <text x="240" y="620" font-family="sans-serif" font-size="11" fill="#cc8833">火矢齐射 🔥</text>
  <text x="400" y="620" font-family="monospace" font-size="11" fill="#cc8833">500</text>
  <text x="480" y="620" font-family="monospace" font-size="11" fill="#cc8833">—</text>
  <text x="560" y="620" font-family="sans-serif" font-size="11" fill="#cc8833">全屏减速 BUFF</text>

  <rect x="40" y="628" width="640" height="26" rx="0" fill="#1a1410"/>
  <text x="60" y="646" font-family="sans-serif" font-size="11" fill="#cc8833">核心</text>
  <text x="130" y="646" font-family="sans-serif" font-size="11" fill="#f0d68a">攻城锤 ~299 抖币</text>
  <text x="240" y="646" font-family="sans-serif" font-size="11" fill="#cc8833">攻城锤 🔨</text>
  <text x="400" y="646" font-family="monospace" font-size="11" fill="#cc8833">1500</text>
  <text x="480" y="646" font-family="monospace" font-size="11" fill="#cc8833">—</text>
  <text x="560" y="646" font-family="sans-serif" font-size="11" fill="#cc8833">直接砸城堡！</text>

  <!-- 宝箱 -->
  <rect x="40" y="654" width="640" height="26" rx="0" fill="#151210"/>
  <text x="60" y="672" font-family="sans-serif" font-size="11" fill="#cc8833">核心</text>
  <text x="130" y="672" font-family="sans-serif" font-size="11" fill="#f0d68a">战争宝箱 ~99 抖币</text>
  <text x="240" y="672" font-family="sans-serif" font-size="11" fill="#cc8833">战争宝箱 📦</text>
  <text x="400" y="672" font-family="sans-serif" font-size="11" fill="#cc8833">随机</text>
  <text x="480" y="672" font-family="sans-serif" font-size="11" fill="#cc8833">—</text>
  <text x="560" y="672" font-family="sans-serif" font-size="11" fill="#cc8833">随机出兵种 搏一搏！</text>

  <!-- 顶级 -->
  <rect x="40" y="680" width="640" height="3" rx="0" fill="#2a2218"/>

  <rect x="40" y="687" width="640" height="26" rx="0" fill="#1a1410"/>
  <text x="60" y="705" font-family="sans-serif" font-size="11" fill="#cc4444">顶级</text>
  <text x="130" y="705" font-family="sans-serif" font-size="11" fill="#ffaa44">城堡 ~520 抖币</text>
  <text x="240" y="705" font-family="sans-serif" font-size="11" fill="#ff6644">岩石巨人 🪨</text>
  <text x="400" y="705" font-family="monospace" font-size="11" fill="#cc4444">500</text>
  <text x="480" y="705" font-family="monospace" font-size="11" fill="#cc4444">2500</text>
  <text x="560" y="705" font-family="sans-serif" font-size="11" fill="#cc4444">带头像 BOSS 级</text>

  <rect x="40" y="713" width="640" height="26" rx="0" fill="#151210"/>
  <text x="60" y="731" font-family="sans-serif" font-size="11" fill="#cc4444">顶级</text>
  <text x="130" y="731" font-family="sans-serif" font-size="11" fill="#ffaa44">龙骑士 ~1200 抖币</text>
  <text x="240" y="731" font-family="sans-serif" font-size="11" fill="#ff6644">龙骑士 🐉</text>
  <text x="400" y="731" font-family="monospace" font-size="11" fill="#cc4444">1000</text>
  <text x="480" y="731" font-family="monospace" font-size="11" fill="#cc4444">5000</text>
  <text x="560" y="731" font-family="sans-serif" font-size="11" fill="#cc4444">喷火+咆哮 以一敌百</text>

  <rect x="40" y="739" width="640" height="26" rx="0" fill="#1a1410"/>
  <text x="60" y="757" font-family="sans-serif" font-size="11" fill="#cc4444">顶级</text>
  <text x="130" y="757" font-family="sans-serif" font-size="11" fill="#ffaa44">天神之怒 ~3000 抖币</text>
  <text x="240" y="757" font-family="sans-serif" font-size="11" fill="#ff6644">天神之怒 ⚡</text>
  <text x="400" y="757" font-family="monospace" font-size="11" fill="#cc4444">8000</text>
  <text x="480" y="757" font-family="monospace" font-size="11" fill="#cc4444">—</text>
  <text x="560" y="757" font-family="sans-serif" font-size="11" fill="#cc4444">终极技能 直接炸城 20%</text>

  <!-- 克制链 -->
  <rect x="20" y="906" width="680" height="42" rx="4" fill="#1a1410" stroke="#c8a44e" stroke-width="1" opacity="0.9"/>
  <text x="40" y="927" font-family="sans-serif" font-size="12" fill="#887766">克制链：民兵 → 突袭兵 → 弓兵 → 矛兵 → 民兵 | 剑士 → 骑士 → 弓手 → 投石车 → 皇家卫队 → 岩石巨人 → 龙骑士</text>
  <text x="40" y="942" font-family="sans-serif" font-size="11" fill="#666">不想被克制？送礼物出克制兵种就好！关注主播免费送民兵~</text>
</svg>
