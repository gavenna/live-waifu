<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>war-danmaku 工具箱</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header id="titlebar">
    <div class="tb-left">⚔ war-danmaku</div>
    <div class="tb-center"><span id="header-status" class="hdr-off">● 未启动</span></div>
    <div class="tb-right">
      <button class="hdr-btn" onclick="openLogsFolder()" title="查看日志">📋</button>
      <button class="hdr-btn hdr-close" onclick="closeWindow()">✕</button>
    </div>
  </header>

  <div id="body">
    <nav id="nav">
      <button class="nav-item active" data-panel="dashboard">
        <span class="nav-icon">◈</span><span>控制台</span>
      </button>
      <button class="nav-item" data-panel="settings">
        <span class="nav-icon">⚙</span><span>设置</span>
      </button>
      <button class="nav-item" data-panel="announcer">
        <span class="nav-icon">🎤</span><span>话术</span>
      </button>
      <button class="nav-item" data-panel="tools">
        <span class="nav-icon">⬡</span><span>工具</span>
      </button>
    </nav>

    <main id="panels">
      <!-- ====== 控制台 ====== -->
      <section id="panel-dashboard" class="panel active">
        <div class="row top-row">
          <div class="card ctrl-card">
            <div class="card-inner">
              <div id="status-area">
                <div id="status-ring" class="ring-off"></div>
                <div id="status-main-text">服务器未启动</div>
                <div id="status-sub-text">点击下方按钮启动</div>
              </div>
              <div class="ctrl-buttons">
                <button id="btn-start" class="btn-primary" onclick="startGame()">▶ 启动游戏</button>
                <button id="btn-douyin" class="btn-douyin" onclick="toggleDouyin()">📡 启动抖音</button>
                <button id="btn-bilibili" class="btn-bilibili" onclick="toggleBilibili()">📺 启动B站</button>
                <button id="btn-stop" class="btn-danger" onclick="stopAll()">■ 全部停止</button>
              </div>
            </div>
          </div>

          <div class="card stats-card">
            <div class="card-title">运行状态</div>
            <div class="stat-grid">
              <div class="stat"><span class="stat-v" id="st-game">—</span><span class="stat-l">游戏服务器</span></div>
              <div class="stat"><span class="stat-v" id="st-frontend">—</span><span class="stat-l">前端页面</span></div>
              <div class="stat"><span class="stat-v" id="st-douyin">—</span><span class="stat-l">抖音适配器</span></div>
              <div class="stat"><span class="stat-v" id="st-bilibili">—</span><span class="stat-l">B站适配器</span></div>
              <div class="stat"><span class="stat-v" id="st-players">0</span><span class="stat-l">在线观众</span></div>
            </div>
          </div>
        </div>

        <div class="card log-card">
          <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
            <span>事件日志</span>
            <span class="log-filter">
              <button class="flt-btn active" data-flt="all">全部</button>
              <button class="flt-btn" data-flt="douyin">抖音</button>
              <button class="flt-btn" data-flt="bilibili">B站</button>
              <button class="flt-btn" data-flt="engine">游戏</button>
              <button class="flt-btn" data-flt="announcer">话术</button>
            </span>
          </div>
          <div id="event-log"><div class="log-empty">等待操作…</div></div>
        </div>
      </section>

      <!-- ====== 设置 ====== -->
      <section id="panel-settings" class="panel">
        <div class="card">
          <div class="card-title">抖音直播</div>
          <div class="form">
            <label><span>启用</span><input type="checkbox" id="cfg-dy-en"></label>
            <label><span>直播间号</span><input type="text" id="cfg-dy-room" placeholder="642238215421"></label>
            <label><span>Cookie</span><textarea id="cfg-dy-ck" rows="3" placeholder="F12→Network→复制Cookie头"></textarea></label>
          </div>
        </div>
        <div class="card">
          <div class="card-title">B站直播</div>
          <div class="form">
            <label><span>直播间号</span><input type="text" id="cfg-bl-room" placeholder="26111140"></label>
            <label><span>Cookie</span><textarea id="cfg-bl-ck" rows="3" placeholder="F12→Network→复制Cookie头"></textarea></label>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn-primary" onclick="saveConfig()">保存设置</button>
          <span id="cfg-save-msg"></span>
        </div>
      </section>

      <!-- ====== 主播话术 ====== -->
      <section id="panel-announcer" class="panel">
        <div class="card">
          <div class="card-title">话术引擎</div>
          <div class="stat-grid" style="margin-bottom:12px">
            <div class="stat"><span class="stat-v" id="ac-enabled">—</span><span class="stat-l">引擎状态</span></div>
            <div class="stat"><span class="stat-v" id="ac-ws">—</span><span class="stat-l">waifu-agent</span></div>
            <div class="stat"><span class="stat-v" id="ac-queue">0</span><span class="stat-l">队列长度</span></div>
            <div class="stat"><span class="stat-v" id="ac-spoken">0</span><span class="stat-l">已播报</span></div>
          </div>
          <div class="form">
            <label><span>启用话术</span><input type="checkbox" id="ac-enable" onchange="saveAnnouncer()"></label>
            <label><span>Dry-Run <em>(跳过TTS)</em></span><input type="checkbox" id="ac-dryrun" onchange="saveAnnouncer()"></label>
            <label><span>日志级别</span><select id="ac-trace" onchange="saveAnnouncer()"><option value="0">0 正常</option><option value="1">1 管线追踪</option><option value="2">2 全量</option></select></label>
          </div>
        </div>

        <div class="card">
          <div class="card-title">播报节奏</div>
          <div class="form">
            <label><span>定期战况间隔 (ms)</span><input type="number" id="ac-report-iv" step="5000" min="10000" onchange="saveAnnouncer()"></label>
            <label><span>礼物冷却 (ms)</span><input type="number" id="ac-gift-cd" step="500" min="0" onchange="saveAnnouncer()"></label>
            <label><span>击杀冷却 (ms)</span><input type="number" id="ac-kill-cd" step="500" min="0" onchange="saveAnnouncer()"></label>
            <label><span>攻城冷却 (ms)</span><input type="number" id="ac-siege-cd" step="500" min="0" onchange="saveAnnouncer()"></label>
            <label><span>城堡伤害阈值</span><input type="number" id="ac-castle-th" step="10" min="10" onchange="saveAnnouncer()"></label>
          </div>
        </div>
      </section>

      <!-- ====== 工具 ====== -->
      <section id="panel-tools" class="panel">
        <div class="card">
          <div class="card-title">组件</div>
          <div class="tool-list">
            <div class="tool-item"><span>war-danmaku.exe</span><span id="comp-game" class="badge">—</span></div>
            <div class="tool-item"><span>douyinLive.exe</span><span id="comp-douyin" class="badge">—</span></div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">快捷链接</div>
          <div class="link-list">
            <button class="btn-link" onclick="window.open('http://localhost:3000')">🎮 打开游戏画面 (localhost:3000)</button>
            <button class="btn-link" onclick="navigator.clipboard.writeText('http://localhost:3000')">📋 复制 OBS 浏览器源地址</button>
            <button class="btn-link" onclick="window.open('https://github.com/barryblueice/douyinLive')">📦 douyinLive 项目页</button>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
